# 本机没有全局装 pytest，且 pip 联网装不上；
# DDZM 项目把 pytest 9.1.1 vendor 在 D:\Deepseek\DDZM\.pylibs。
# 跑测试前把它加进 PYTHONPATH：
#
#   $env:PYTHONPATH='D:\Deepseek\DDZM\.pylibs'; python -m pytest tests -q
#
[pytest]
testpaths = tests
pythonpath = .
# 本机沙箱不允许在项目内建缓存目录，直接关掉 cacheprovider
# 注意：**不要用 pytest 的 tmp_path 夹具** —— 它的 tmpdir 插件在本机沙箱下
# 会 PermissionError（basetemp/scandir 被拒）。改用 conftest 的 `dbdir` 夹具。
addopts = -q -p no:cacheprovider
