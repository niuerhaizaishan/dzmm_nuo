<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>糯控 · 设备探测</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#14161a;color:#e6e6ea;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  h1{font-size:17px;margin:4px 0 4px;font-weight:600}
  .sub{color:#8b93a1;font-size:12px;margin-bottom:14px}
  .card{background:#1c1f25;border:1px solid #2a2f38;border-radius:12px;padding:14px;margin-bottom:12px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;margin-left:6px}
  .off{background:#4a2020;color:#f09c9c}.on{background:#204a2f;color:#7ee2a8}
  button{width:100%;padding:13px;border-radius:10px;border:0;background:#2f3743;color:#dfe4ec;font-size:15px;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:#b0533f;color:#fff}
  button.danger{background:#7d2b22;color:#fff;font-weight:600}
  button.ghost{background:#242a33;color:#aab3c0;font-size:13px;padding:10px}
  .row{display:flex;gap:8px}.row button{margin-top:0}
  label{display:block;font-size:12px;color:#8b93a1;margin:12px 0 6px}
  input[type=range]{width:100%}
  .big{font-size:22px;font-weight:600;color:#f0c9a8}
  #log{font:12px/1.65 ui-monospace,Consolas,monospace;color:#9aa4b2;max-height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .ok{color:#7ee2a8}.bad{color:#f09c9c}.warn{color:#e6c98a}.dim{color:#6f7784}
  ol{padding-left:18px;margin:8px 0 0;color:#9aa4b2;font-size:12.5px}
  li{margin:4px 0}
</style>
</head>
<body>
<main>
  <h1>糯控 · 设备探测<span id="pill" class="pill off">未连接</span></h1>
  <div class="sub">Lovense Lush 4 Mini · 只在这一页里试，不会自动跑任何东西</div>

  <div class="card">
    <div class="row">
      <button id="btn-connect" class="primary">连接设备</button>
      <button id="btn-disconnect" class="ghost">断开</button>
    </div>
    <button id="btn-connect-all" class="ghost" style="margin-top:8px">扫描全部设备（列表里没有 LVS- 时用）</button>
    <div id="hint" class="dim" style="font-size:12px;margin-top:10px"></div>
  </div>

  <div class="card">
    <label>强度 <span class="big" id="lv">20</span> / 20</label>
    <input type="range" id="level" min="0" max="20" step="1" value="20">
    <div class="row" style="margin-top:10px">
      <button id="btn-test">1 秒测试</button>
      <button id="btn-apply">持续</button>
    </div>
    <button id="btn-stop" class="danger" style="margin-top:10px">立即停止</button>
    <div class="dim" style="font-size:11.5px;margin-top:10px">持续模式 8 秒后自动停；关掉页面/断开连接也会先发一次停止。</div>
  </div>

  <div class="card">
    <div class="row">
      <button id="btn-type" class="ghost">查设备类型</button>
      <button id="btn-battery" class="ghost">查电量</button>
    </div>
  </div>

  <div class="card">
    <label style="margin-top:0">探测日志（装好后点「复制」，整段发我）</label>
    <div id="log"></div>
    <div class="row" style="margin-top:10px">
      <button id="btn-copy" class="ghost">复制日志</button>
      <button id="btn-clear" class="ghost">清空</button>
    </div>
  </div>

  <div class="card">
    <label style="margin-top:0">手动判定</label>
    <div class="row">
      <button id="btn-yes" class="ghost">震了</button>
      <button id="btn-no" class="ghost">没反应</button>
    </div>
    <ol>
      <li>先开玩具电源，让它进入可连接状态（不要跟系统蓝牙配对）</li>
      <li>点「连接设备」，在弹窗里选名字以 LVS- 开头的那个</li>
      <li>点「1 秒测试」，看它有反应没，然后按下面两个按钮记下来</li>
      <li>如果没反应，换一种「写法」再试（页面会自动轮换）</li>
    </ol>
  </div>
</main>

<script>
"use strict";

// Lovense 的三套候选服务/特征（来自 Buttplug 的 lovense 协议定义）
const SETS = [
  { key: "A(fff0)", service: "0000fff0-0000-1000-8000-00805f9b34fb",
    tx: "0000fff2-0000-1000-8000-00805f9b34fb", rx: "0000fff1-0000-1000-8000-00805f9b34fb" },
  { key: "B(NUS)", service: "6e400001-b5a3-f393-e0a9-e50e24dcca9e",
    tx: "6e400002-b5a3-f393-e0a9-e50e24dcca9e", rx: "6e400003-b5a3-f393-e0a9-e50e24dcca9e" },
  { key: "C(5030)", service: "50300001-0024-4bd4-bbd5-a6920e4c5653",
    tx: "50300002-0024-4bd4-bbd5-a6920e4c5653", rx: "50300003-0024-4bd4-bbd5-a6920e4c5653" },
];
const SERVICES = SETS.map((s) => s.service);

const state = {
  device: null, server: null, charset: null, writeMode: "", setKey: "", padTo: 0,
  variantIndex: 0, autoStop: null, busy: false,
};

const $ = (s) => document.querySelector(s);
const lv = $("#lv");
const logBox = $("#log");

function ts() {
  const d = new Date();
  return d.toTimeString().slice(0, 8);
}
function log(msg, cls = "") {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `[${ts()}] ${msg}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}
function setPill(on) {
  const p = $("#pill");
  p.className = "pill " + (on ? "on" : "off");
  p.textContent = on ? "已连接" : "未连接";
}

// 两种写法：0 = 原样 ASCII；1 = 补齐到 16 字节
function encode(cmd) {
  const raw = new TextEncoder().encode(cmd);
  if (state.variantIndex === 0) return raw;
  const buf = new Uint8Array(16);
  buf.set(raw.slice(0, 16));
  return buf;
}
const VARIANT_NAME = ["原样ASCII", "补齐16字节"];

async function findWritable(server) {
  for (const set of SETS) {
    let svc;
    try {
      svc = await server.getPrimaryService(set.service);
    } catch (e) {
      log(`  服务 ${set.key} 不存在`, "dim");
      continue;
    }
    let chars = [];
    try {
      chars = await svc.getCharacteristics();
    } catch (e) {
      log(`  服务 ${set.key} 取特征失败: ${e.name}`, "bad");
      continue;
    }
    for (const c of chars) {
      const p = c.properties || {};
      log(`  特征 ${c.uuid}  write=${!!p.write} noResp=${!!p.writeWithoutResponse} notify=${!!p.notify}`, "dim");
      if (p.write || p.writeWithoutResponse) {
        return { set, char: c, writable: true };
      }
    }
  }
  return null;
}

async function write(char, bytes) {
  if (char.properties.writeWithoutResponse && char.writeValueWithoutResponse) {
    await char.writeValueWithoutResponse(bytes);
    state.writeMode = "无回应写";
  } else if (char.properties.write && char.writeValueWithResponse) {
    await char.writeValueWithResponse(bytes);
    state.writeMode = "有回应写";
  } else {
    await char.writeValue(bytes);
    state.writeMode = "writeValue";
  }
}

async function send(cmd, note = "") {
  if (!state.charset) throw new Error("还没连上");
  const bytes = encode(cmd);
  await write(state.charset, bytes);
  log(`→ ${cmd}${note ? " " + note : ""}（${VARIANT_NAME[state.variantIndex]}，${state.writeMode}，${bytes.length}B）`, "ok");
}

async function stopNow(reason = "手动") {
  clearTimeout(state.autoStop);
  state.autoStop = null;
  if (!state.charset) return;
  try {
    await send("Vibrate:0;", `停止/${reason}`);
  } catch (e) {
    log(`停止失败：${e.name} ${e.message || ""}`, "bad");
  }
}

async function connect(acceptAll) {
  if (!navigator.bluetooth) {
    log("这个浏览器不支持 Web Bluetooth。请用安卓 Chrome，且页面必须是 HTTPS。", "bad");
    $("#hint").textContent = "当前页面不是 HTTPS，或浏览器不支持。";
    return;
  }
  $("#btn-connect").disabled = true;
  try {
    log("正在打开设备选择框…（选 LVS- 开头的那个；没有就点「扫描全部设备」）");
    state.device = await navigator.bluetooth.requestDevice(acceptAll
      ? { acceptAllDevices: true, optionalServices: SERVICES }
      : { filters: [{ namePrefix: "LVS-" }], optionalServices: SERVICES });
    log(`选中：${state.device.name || "(无名)"} id=${state.device.id}`, "ok");
    state.device.addEventListener("gattserverdisconnected", () => {
      log("蓝牙连接断开", "warn");
      setPill(false);
      state.charset = null;
    });
    state.server = await state.device.gatt.connect();
    log("GATT 已连接，开始找可写特征…");
    const found = await findWritable(state.server);
    if (!found) {
      log("三套服务里都没找到可写特征 —— 这个型号需要另想办法", "bad");
      return;
    }
    state.charset = found.char;
    state.setKey = found.set.key;
    log(`命中：${found.set.key} / ${found.char.uuid}`, "ok");
    // 试订阅回包
    const rx = found.set.rx;
    try {
      const rxChar = await (await state.server.getPrimaryService(found.set.service)).getCharacteristic(rx);
      await rxChar.startNotifications();
      rxChar.addEventListener("characteristicvaluechanged", (ev) => {
        const v = ev.target.value;
        const bytes = new Uint8Array(v.buffer);
        let text = "";
        for (const b of bytes) text += b >= 32 && b < 127 ? String.fromCharCode(b) : ".";
        log(`← ${text}`, "dim");
      });
      log("已订阅回包", "dim");
    } catch (e) {
      log(`订阅回包失败（不影响控制）：${e.name}`, "dim");
    }
    setPill(true);
    $("#hint").textContent = `命中 ${found.set.key}，写法 ${VARIANT_NAME[state.variantIndex]}`;
  } catch (e) {
    log(`连接失败：${e.name} ${e.message || ""}`, "bad");
  } finally {
    $("#btn-connect").disabled = false;
  }
}

async function testPulse() {
  if (!state.charset) return log("先连接设备", "warn");
  const level = Number($("#level").value);
  try {
    await send(`Vibrate:${level};`, "1 秒测试");
    setTimeout(() => stopNow("测试结束"), 1000);
  } catch (e) {
    log(`测试失败：${e.name} ${e.message || ""}`, "bad");
    log("换一种写法再点一次试试", "warn");
  }
}

async function applyLevel() {
  if (!state.charset) return log("先连接设备", "warn");
  const level = Number($("#level").value);
  try {
    await send(`Vibrate:${level};`, "持续");
    clearTimeout(state.autoStop);
    state.autoStop = setTimeout(() => stopNow("8 秒自动停"), 8000);
  } catch (e) {
    log(`下发失败：${e.name} ${e.message || ""}`, "bad");
  }
}

function cycleVariant() {
  state.variantIndex = (state.variantIndex + 1) % VARIANT_NAME.length;
  log(`切换到写法：${VARIANT_NAME[state.variantIndex]}`, "warn");
  $("#hint").textContent = `命中 ${state.setKey || "未连接"}，写法 ${VARIANT_NAME[state.variantIndex]}`;
}

async function query(cmd, label) {
  if (!state.charset) return log("先连接设备", "warn");
  try {
    await send(cmd, label);
    log("（如果订阅成功，回包会出现在上面）", "dim");
  } catch (e) {
    log(`${label}失败：${e.name}`, "bad");
  }
}

$("#level").addEventListener("input", () => { lv.textContent = $("#level").value; });
$("#btn-connect").addEventListener("click", () => connect(false));
$("#btn-connect-all").addEventListener("click", () => connect(true));
$("#btn-disconnect").addEventListener("click", async () => {
  await stopNow("断开前");
  try { state.device && state.device.gatt.connected && state.device.gatt.disconnect(); } catch (e) {}
  state.charset = null; setPill(false); log("已断开", "dim");
});
$("#btn-test").addEventListener("click", testPulse);
$("#btn-apply").addEventListener("click", applyLevel);
$("#btn-stop").addEventListener("click", () => stopNow("手动"));
$("#btn-type").addEventListener("click", () => query("DeviceType;", "查类型"));
$("#btn-battery").addEventListener("click", () => query("Battery;", "查电量"));
$("#btn-clear").addEventListener("click", () => { logBox.textContent = ""; });
$("#btn-copy").addEventListener("click", async () => {
  const text = logBox.innerText;
  try {
    await navigator.clipboard.writeText(text);
    log("日志已复制到剪贴板", "ok");
  } catch (e) {
    const r = document.createRange(); r.selectNodeContents(logBox);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    log("已选中，请手动复制", "warn");
  }
});
$("#btn-yes").addEventListener("click", () => {
  log(`【人工判定】震了 ✓ 命中=${state.setKey || "?"} 写法=${VARIANT_NAME[state.variantIndex]} 写模式=${state.writeMode || "?"}`, "ok");
});
$("#btn-no").addEventListener("click", () => {
  log(`【人工判定】没反应 ✗ 命中=${state.setKey || "?"} 写法=${VARIANT_NAME[state.variantIndex]}`, "bad");
  log("再点一次「1 秒测试」会自动换到另一种写法", "warn");
  cycleVariant();
});

window.addEventListener("pagehide", () => { if (state.charset) { try { encode("Vibrate:0;"); write(state.charset, encode("Vibrate:0;")); } catch (e) {} } });
document.addEventListener("visibilitychange", () => { if (document.hidden) log("页面切到后台了 —— Web Bluetooth 在后台可能被系统挂起", "warn"); });

log("页面已加载。HTTPS：" + (location.protocol === "https:") +
    " · 支持 Web Bluetooth：" + (!!navigator.bluetooth), navigator.bluetooth ? "ok" : "bad");
if (!navigator.bluetooth) log("需要安卓 Chrome + HTTPS 页面。", "bad");
</script>
</body>
</html>
