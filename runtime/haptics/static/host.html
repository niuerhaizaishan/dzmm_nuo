<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>糯控 · 分享控制</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#14161a;color:#e6e6ea;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:17px;margin:4px 0 12px;font-weight:600}
  .card{background:#1c1f25;border:1px solid #2a2f38;border-radius:12px;padding:14px;margin-bottom:12px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;margin-left:6px}
  .off{background:#4a2020;color:#f09c9c}.on{background:#204a2f;color:#7ee2a8}
  button{width:100%;padding:13px;border-radius:10px;border:0;background:#2f3743;color:#dfe4ec;font-size:15px;cursor:pointer;margin-top:10px}
  button.primary{background:#b0533f;color:#fff}
  button.danger{background:#7d2b22;color:#fff;font-weight:600}
  button.ghost{background:#242a33;color:#aab3c0;font-size:13px;padding:10px}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px}.row button{margin-top:0}
  #qr{display:flex;justify-content:center;background:#fff;border-radius:10px;padding:10px;margin:10px 0}
  #qr img,#qr canvas{display:block}
  .code{font:22px/1.2 ui-monospace,Consolas,monospace;letter-spacing:5px;color:#f0c9a8;text-align:center;margin:6px 0}
  #link{font:11.5px/1.5 ui-monospace,monospace;color:#8b93a1;word-break:break-all;text-align:center}
  #log{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa4b2;max-height:34vh;overflow:auto;white-space:pre-wrap}
  .dim{color:#6f7784;font-size:12px}
</style>
</head>
<body><main>
  <h1>糯控 · 分享控制<span id="pill" class="pill off">未连接</span></h1>

  <div class="card">
    <div class="row"><button id="btn-connect" class="primary">连接设备</button>
    <button id="btn-stop" class="danger">立即停止</button></div>
    <div class="row"><button id="btn-short">自测 · 短 0.4 秒</button>
    <button id="btn-long">自测 · 长 1.2 秒</button></div>
    <div id="devstate" class="dim" style="margin-top:10px">未连接设备</div>
  </div>

  <div class="card">
    <button id="btn-share" class="primary">生成分享码（让别人扫码控制）</button>
    <div id="sharebox" hidden>
      <div id="qr"></div>
      <div class="code" id="pin">------</div>
      <div class="dim" style="text-align:center">PIN（二维码里已带，念给对方也行）</div>
      <div id="link" style="margin-top:8px"></div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#aab3c0">
        <input type="checkbox" id="allowbot" style="width:auto;margin:0"> 允许小小糯控制（群里 /震、/停）
      </label>
      <button id="btn-end" class="ghost" style="margin-top:10px">结束分享</button>
    </div>
    <div id="sharestate" class="dim" style="margin-top:10px">未开分享</div>
  </div>

  <div class="card">
    <div class="dim" style="margin-top:0">群友权限 · 谁能用 /震 /预设 /停</div>
    <div id="roster" style="margin-top:8px"></div>
    <div id="allowmsg" class="dim" style="margin-top:8px">改一次就存一次，机器人那边立刻生效（不用重启）。</div>
  </div>

  <div class="card">
    <div class="dim" style="margin-top:0">日志</div>
    <div id="log"></div>
  </div>
</main>

<script src="qrcode.min.js"></script>
<script>
"use strict";
const STATIC_SETS=[
  {key:"5330-0023",service:"53300001-0023-4bd4-bbd5-a6920e4c5653",tx:"53300002-0023-4bd4-bbd5-a6920e4c5653",rx:"53300003-0023-4bd4-bbd5-a6920e4c5653"},
  {key:"fff0",service:"0000fff0-0000-1000-8000-00805f9b34fb",tx:"0000fff2-0000-1000-8000-00805f9b34fb",rx:"0000fff1-0000-1000-8000-00805f9b34fb"},
  {key:"NUS",service:"6e400001-b5a3-f393-e0a9-e50e24dcca9e",tx:"6e400002-b5a3-f393-e0a9-e50e24dcca9e",rx:"6e400003-b5a3-f393-e0a9-e50e24dcca9e"}
];
const GEN3=[];
for(const y of "0123456789abcdef")for(const [x,z] of [["4","3"],["5","4"]])
  GEN3.push({key:`gen3-${x}${y}-${z}`,service:`${x}${y}300001-002${z}-4bd4-bbd5-a6920e4c5653`,
             tx:`${x}${y}300002-002${z}-4bd4-bbd5-a6920e4c5653`,
             rx:`${x}${y}300003-002${z}-4bd4-bbd5-a6920e4c5653`});
const SETS=STATIC_SETS.concat(GEN3);
const SERVICES=SETS.map(s=>s.service);

const S={device:null,server:null,char:null,rx:null,deviceName:"",ws:null,sid:"",pin:"",lastAck:null,ackWaiter:null,
         base:0,beat:null,manual:null,patternRun:false,lastN:-1,music:0,musicBeat:false};
const $=s=>document.querySelector(s);
const logBox=$("#log");
function log(m,c=""){const d=document.createElement("div");if(c)d.className=c;d.textContent=`[${new Date().toTimeString().slice(0,8)}] ${m}`;logBox.appendChild(d);logBox.scrollTop=logBox.scrollHeight}
function pill(on){const p=$("#pill");p.className="pill "+(on?"on":"off");p.textContent=on?"设备已连接":"未连接"}
function clampLevel(v){return Math.max(0,Math.min(20,Math.round((Number(v)||0)*20)))}
const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms)));

/* 预设节奏：每一步 = 一个形状系数 + 通电时长 + 断电间隙。
   服务端只转发预设 id 和总时长，具体波形全在这台手机上跑（它必须在前台）。 */
const PATTERNS={
  tap:{name:"点按",step:()=>({shape:1.0,on:300,off:400})},
  pulse:{name:"脉冲",step:()=>({shape:0.7,on:600,off:300})},
  heartbeat:{name:"心跳",step:i=>i%2===0?{shape:0.60,on:150,off:100}:{shape:0.80,on:150,off:600}},
  ramp:{name:"渐强",step:(i,n)=>({shape:0.2+0.8*Math.min(i,n-1)/(n-1),on:500,off:0})},
  ramp_down:{name:"渐弱",step:(i,n)=>({shape:1.0-0.8*Math.min(i,n-1)/(n-1),on:500,off:0})},
  stutter:{name:"连抖",step:()=>({shape:0.8,on:150,off:150})},
  hold:{name:"全开",step:()=>({shape:1.0,on:60000,off:0})}
};
let runToken=0;
function stopRun(){runToken++}

async function findChar(server){
  for(const set of SETS){
    try{
      const svc=await server.getPrimaryService(set.service);
      for(const c of await svc.getCharacteristics()){
        const p=c.properties||{};
        if(p.write||p.writeWithoutResponse) return {set,char:c};
      }
    }catch(e){}
  }
  return null;
}
async function connect(){
  $("#btn-connect").disabled=true;
  try{
    if(!navigator.bluetooth) throw new Error("这个浏览器不支持 Web Bluetooth，请用安卓 Chrome");
    S.device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"LVS-"}],optionalServices:SERVICES});
    S.deviceName=S.device.name||"";
    S.device.addEventListener("gattserverdisconnected",()=>{pill(false);log("蓝牙断开","bad");S.char=null;S.lastN=-1});
    S.server=await S.device.gatt.connect();
    const found=await findChar(S.server);
    if(!found) throw new Error("没找到可写特征");
    S.char=found.char;
    log("已连接 "+S.deviceName+"（服务 "+found.set.key+"）","ok");
    try{
      const svc=await S.server.getPrimaryService(found.set.service);
      S.rx=await svc.getCharacteristic(found.set.rx);
      await S.rx.startNotifications();
      S.rx.addEventListener("characteristicvaluechanged",ev=>{
        const b=new Uint8Array(ev.target.value.buffer);
        let t="";for(const x of b)t+=x>=32&&x<127?String.fromCharCode(x):".";
        log("← "+t,"dim");
        if(S.ackWaiter&&t.includes("OK")){const w=S.ackWaiter;S.ackWaiter=null;w(t)}
      });
    }catch(e){log("订阅回包失败（不影响下发）","dim")}
    pill(true);
    $("#devstate").textContent="设备："+S.deviceName+" · 就绪";
    startMotor();
    sendState();
  }catch(e){log("连接失败："+e.message,"bad")}
  finally{$("#btn-connect").disabled=false}
}
async function write(cmd,quiet){
  if(!S.char) throw new Error("设备未连接");
  const bytes=new TextEncoder().encode(cmd);
  if(S.char.properties.writeWithoutResponse&&S.char.writeValueWithoutResponse)
    await S.char.writeValueWithoutResponse(bytes);
  else await S.char.writeValue(bytes);
  if(!quiet)log("→ "+cmd,"ok");
}
function waitAck(ms=700){
  return new Promise(res=>{S.ackWaiter=res;setTimeout(()=>{if(S.ackWaiter===res){S.ackWaiter=null;res("")}},ms)});
}
/* ---------- 马达循环：背景底噪 + 剧情段落 ----------
   每 120ms 算一次"现在该输出多大"，变了才写。优先级：
     手动档位 > 剧情段落（按节奏函数随时间起伏）> 背景底噪
   段落跑完自己回落到背景，不需要谁再发停止。 */
const RHYTHMS={
  steady:()=>1,
  breathe:t=>0.5+0.5*Math.sin(2*Math.PI*t/6000),
  heartbeat:t=>{const c=t%1000;return c<180?1:(c<320?0:(c<480?0.85:0))},
  wave:t=>0.6+0.4*Math.sin(2*Math.PI*t/4000),
  stutter:t=>{const c=t%700;return c<400?1:0}
};
function startBeat(level,ms,rhythm){
  const now=performance.now();
  S.beat={level:Math.max(0,Math.min(1,Number(level)||0)),startAt:now,
          endAt:now+Math.max(500,ms),rhythm:RHYTHMS[rhythm]?rhythm:"steady"};
  S.manual=null;S.lastN=-1;
  log("段落 "+Math.round(S.beat.level*100)+"% × "+Math.round(ms/1000)+"s · "+S.beat.rhythm,"ok");
}
let motorTimer=null;
async function motorTick(){
  if(!S.char||S.patternRun||S.ticking)return;
  const now=performance.now();
  let want;
  if(S.manual!==null) want=S.manual;
  else if(S.beat&&now<S.beat.endAt) want=S.beat.level*RHYTHMS[S.beat.rhythm](now-S.beat.startAt);
  else{
    if(S.beat){S.beat=null;log("段落结束 → 回到底噪","dim")}
    /* 音乐律动夹在段落和底噪之间：有人放歌时按实时档位跟，没放歌才落回底噪。
       拍点（musicBeat）给一个短促的抬升，其余时间跟着平滑档位走。 */
    want=S.music>0
      ? Math.min(1,S.music*(S.musicBeat?1.35:1))
      : S.base;
  }
  const n=clampLevel(want);
  if(n===S.lastN)return;
  S.lastN=n;
  S.ticking=true;
  try{await write(`Vibrate:${n};`,true)}catch(e){S.lastN=-1}
  finally{S.ticking=false}
}
function startMotor(){
  if(!motorTimer)motorTimer=setInterval(motorTick,120);
}
async function stopNow(reason){
  stopRun();                                   // 预设执行器也让位
  S.beat=null;S.manual=null;S.base=0;S.music=0;S.musicBeat=false;S.lastN=-1;
  if(!S.char)return;
  try{await write("Vibrate:0;");log("停止（"+reason+"）","warn")}catch(e){}
}
/* 跑一条六十秒的预设：按 steps 循环，到点就停；token 变了就立刻放弃。
   预设自带每一步的强度（节奏的一部分），跑的时候马达循环让位。 */
async function runPattern(id,totalMs){
  const def=PATTERNS[id];
  if(!def)return log("未知预设 "+id,"bad");
  const token=++runToken;
  S.patternRun=true;S.beat=null;S.manual=null;
  const start=performance.now();
  const n=Math.max(2,Math.round(totalMs/500));
  let i=0;
  try{
    while(token===runToken){
      const left=totalMs-(performance.now()-start);
      if(left<=0)break;
      const st=def.step(i++,n);
      const lv=clampLevel(st.shape);
      await write(`Vibrate:${lv};`);
      if(token!==runToken)return;
      await sleep(Math.min(st.on,left));
      if(token!==runToken)return;
      if(st.off>0){
        await write("Vibrate:0;");
        await sleep(Math.min(st.off,Math.max(0,totalMs-(performance.now()-start))));
      }
    }
    if(token===runToken)log("预设「"+def.name+"」结束","warn");
  }finally{
    if(token===runToken){S.patternRun=false;S.lastN=-1;}   // 交还给马达循环（回底噪）
  }
}
/* 手动档位：拖到哪就按那个强度一直震，直到「立即停止」或拖回 0。 */
async function manualLevel(value){
  stopRun();
  const v=Math.max(0,Math.min(1,Number(value)||0));
  if(v<=0){await stopNow("档位归零");return}
  S.patternRun=false;S.beat=null;S.manual=v;S.lastN=-1;
  $("#devstate").textContent="手动档位 "+Math.round(v*100)+"%（"+(S.deviceName||"设备")+"）";
}
function sendState(){
  if(S.ws&&S.ws.readyState===1)
    S.ws.send(JSON.stringify({t:"state",device:S.deviceName}));
}
/* ---------- 分享 ---------- */
async function createShare(){
  if(!S.char) return log("先连接设备","warn");
  $("#btn-share").disabled=true;
  try{
    const r=await fetch("api/session",{method:"POST"});
    const d=await r.json();
    S.sid=d.sid;S.pin=d.pin;
    $("#pin").textContent=d.pin;
    $("#link").textContent=d.link;
    $("#qr").replaceChildren();
    new QRCode($("#qr"),{text:d.link,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
    $("#sharebox").hidden=false;
    openHostWS();
    loadRoster();
    log("已开分享："+d.link,"ok");
  }catch(e){log("开分享失败："+e.message,"bad")}
  finally{$("#btn-share").disabled=false}
}
function openHostWS(){
  const proto=location.protocol==="https:"?"wss":"ws";
  S.ws=new WebSocket(`${proto}://${location.host}${location.pathname.replace(/\/[^/]*$/,"")}/ws/host?sid=${S.sid}&pin=${S.pin}`);
  S.ws.onopen=()=>{
    S.ws.send(JSON.stringify({t:"hello",device:S.deviceName}));
    $("#sharestate").textContent="分享中 · 等待对方扫码";
  };
  S.ws.onmessage=async ev=>{
    let d;try{d=JSON.parse(ev.data)}catch{return}
    if(d.t==="guest_joined"){log("有人扫码接入了","ok");$("#sharestate").textContent="对方正在控制"}
    if(d.t==="cmd"){
      stopRun();S.patternRun=false;S.beat=null;S.manual=null;S.lastN=-1;
      try{
        if(d.pattern){
          const def=PATTERNS[d.pattern];
          if(!def){
            S.ws.send(JSON.stringify({t:"ack",id:d.id,ok:false,raw:"unknown pattern"}));
          }else{
            const total=Math.max(200,d.total_ms||60000);
            S.ws.send(JSON.stringify({t:"ack",id:d.id,ok:true,raw:"pattern:"+d.pattern}));
            log("收到预设「"+def.name+"」"+(total/1000)+" 秒","ok");
            runPattern(d.pattern,total).catch(e=>log("预设中断："+e.message,"bad"));
          }
        }else{
          const n=clampLevel(d.level||0);
          await write(`Vibrate:${n};`);
          const ack=await waitAck();
          S.ws.send(JSON.stringify({t:"ack",id:d.id,ok:!!ack,raw:ack||"sent"}));
          // 单发＝一段"稳"的短段落，到点由马达循环自己回到底噪
          startBeat(d.level||0,Math.max(200,d.duration_ms||1000),"steady");
        }
      }catch(e){
        S.ws.send(JSON.stringify({t:"ack",id:d.id,ok:false,raw:String(e.message||e)}));
        log("执行失败："+e.message,"bad");
      }
      $("#sharestate").textContent=d.pattern
        ? "对方正在控制（预设 "+((PATTERNS[d.pattern]||{}).name||d.pattern)+"）"
        : "对方正在控制（最近 "+(d.level*100).toFixed(0)+"%）";
    }
    if(d.t==="beat"){
      startBeat(d.level||0,Math.max(500,d.duration_ms||6000),d.rhythm||"steady");
      $("#sharestate").textContent="剧情段落 "+Math.round((d.level||0)*100)+"% · "+(d.rhythm||"steady");
    }
    if(d.t==="baseline"){
      S.base=Math.max(0,Math.min(1,Number(d.value)||0));
      S.lastN=-1;
      log("背景层 "+(S.base>0?Math.round(S.base*100)+"%":"关"),"dim");
    }
    if(d.t==="music"){
      /* 语音房音乐律动：服务端算好的 0~1 档位，可能每秒来好几条，所以不写日志 */
      S.music=Math.max(0,Math.min(1,Number(d.value)||0));
      S.musicBeat=!!d.beat;
      S.lastN=-1;
      if(S.music>0){
        $("#sharestate").textContent="音乐律动 "+Math.round(S.music*100)+"%";
      }else{
        $("#sharestate").textContent="音乐律动 关";
      }
    }
    if(d.t==="level"){
      // 手动档位：绝对值，直接按这个强度震，不看预设
      await manualLevel(d.value);
      $("#sharestate").textContent="对方手动档位 "+Math.round(Math.max(0,Math.min(1,d.value||0))*100)+"%";
    }
    if(d.t==="stop"){await stopNow(d.reason||"对方要求")}
  };
  S.ws.onclose=()=>{$("#sharestate").textContent="分享已断开"};
  S.ws.onerror=()=>log("分享连接出错","bad");
}
async function endShare(){
  await stopNow("结束分享");
  if(S.ws){try{S.ws.close()}catch(e){}S.ws=null}
  S.sid="";S.pin="";
  $("#sharebox").hidden=true;
  $("#sharestate").textContent="未开分享";
  $("#allowbot").checked=false;   // 房间作废后许可也一起清掉
  log("已结束分享","warn");
}
$("#btn-connect").addEventListener("click",connect);
$("#btn-stop").addEventListener("click",()=>stopNow("房主手动"));

/* ---------- 群友权限 ---------- */
const ROSTER=[
  {name:"糯糯～（我）", uid:"a56cbd67-3a1e-439a-8beb-d1557dbeff79", fixed:true},
  {name:"御褚",        uid:"cf1b1360-7f3f-4ef8-9188-07d718fe9173", fixed:true},
  {name:"紫苑",        uid:"79c910d0-e0e8-40c8-9d84-ad4c6a45bd49"},
  {name:"过期少女",     uid:"2fd9d11a-846e-4654-b309-9931a4b0ebe1"},
  {name:"过期少女（薰妈妈）", uid:"625e5f9f-a649-40ec-8843-43f2632644c4"},
  {name:"裳",          uid:"77a9b4dd-de55-458a-a1d9-a0d028ca3ae4"},
  {name:"珍妮",        uid:"6f77a7cf-4916-4a78-ab50-8e16bbbded32"}
];
let allowUids=[];
function renderRoster(){
  const box=$("#roster");box.replaceChildren();
  for(const person of ROSTER){
    const on=person.fixed||allowUids.indexOf(person.uid)>=0;
    const label=document.createElement("label");
    label.style.cssText="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;color:#aab3c0";
    const cb=document.createElement("input");
    cb.type="checkbox";cb.style.cssText="width:auto;margin:0";
    cb.checked=on;cb.disabled=!!person.fixed;
    cb.addEventListener("change",()=>togglePerson(person,cb.checked));
    const span=document.createElement("span");
    span.textContent=person.name+(person.fixed?"（默认）":"");
    label.append(cb,span);
    box.appendChild(label);
  }
}
function togglePerson(person,on){
  const set=new Set(allowUids);
  if(on)set.add(person.uid);else set.delete(person.uid);
  allowUids=[...set];
  saveRoster();
}
async function saveRoster(){
  if(!S.sid){$("#allowmsg").textContent="先生成分享码（要 sid 才能存）。";renderRoster();return}
  try{
    const r=await fetch("api/allow",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sid:S.sid,pin:S.pin,uids:allowUids,
        names:ROSTER.filter(p=>allowUids.indexOf(p.uid)>=0).map(p=>p.name)})});
    const d=await r.json();
    if(!d.ok){$("#allowmsg").textContent="没存上："+(d.error||"未知");return}
    allowUids=d.allow.uids||[];
    const names=ROSTER.filter(p=>allowUids.indexOf(p.uid)>=0).map(p=>p.name);
    $("#allowmsg").textContent="已保存："+(names.join("、")||"（只有主人）");
    renderRoster();
  }catch(e){$("#allowmsg").textContent="保存失败："+e.message}
}
async function loadRoster(){
  if(!S.sid){$("#allowmsg").textContent="先生成分享码，权限列表才能读写。";return}
  try{
    const r=await fetch("api/allow?sid="+encodeURIComponent(S.sid)+"&pin="+encodeURIComponent(S.pin));
    const d=await r.json();
    if(d.ok){allowUids=(d.allow&&d.allow.uids)||[];renderRoster();
      const names=ROSTER.filter(p=>allowUids.indexOf(p.uid)>=0).map(p=>p.name);
      $("#allowmsg").textContent="当前："+(names.join("、")||"（只有主人）");}
  }catch(e){$("#allowmsg").textContent="读取失败："+e.message}
}
renderRoster();
async function testFire(ms){
  stopRun();S.patternRun=false;
  try{
    await write(`Vibrate:${clampLevel(0.5)};`);
    startBeat(0.5,ms,"steady");
    log("自测 "+ms+"ms","ok");
  }catch(e){log("自测失败："+e.message,"bad")}
}
$("#btn-short").addEventListener("click",()=>testFire(400));
$("#btn-long").addEventListener("click",()=>testFire(1200));
$("#btn-share").addEventListener("click",createShare);
$("#btn-end").addEventListener("click",endShare);
$("#allowbot").addEventListener("change",async()=>{
  if(!S.sid){log("先生成分享码","warn"); $("#allowbot").checked=false; return}
  try{
    const r=await fetch("api/program/allow",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sid:S.sid,pin:S.pin,allow:$("#allowbot").checked})});
    const d=await r.json();
    log((d.allow_program?"已允许":"已撤回")+"小小糯控制","ok");
  }catch(e){log("设置失败："+e.message,"bad")}
});
window.addEventListener("pagehide",()=>{if(S.char){try{write("Vibrate:0;")}catch(e){}}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)log("页面切到后台，蓝牙可能被挂起，建议保持前台","warn")});
log("页面已加载。HTTPS："+(location.protocol==="https:")+" · Web Bluetooth："+(!!navigator.bluetooth),navigator.bluetooth?"ok":"bad");
</script>
