# 生产 compose（/opt/dzmm/docker-compose.yml 的唯一权威来源）。
#
# ⚠️ 与仓库根的 docker-compose.yml **不是同一份**：那份是本地隔离开发副本
#    （container_name: dzmm-botapi），deploy.ps1 已把它列入"永不上传"。
#
# 应用方式（不要手工 scp 覆盖后直接 up，先 validate）：
#     .\deploy.ps1 -Action compose
#
# 需要存在于 /opt/dzmm/.env 的键（本文件只做透传，不写死值）：
#   DZMM_BOT_TOKEN / DZMM_BOT_ID / DZMM_BOT_CID / DZMM_BOT_ROUTING
services:
  dzmm-bot:
    build: .
    image: dzmm-bot:latest
    container_name: dzmm-bot
    restart: unless-stopped
    # 2026-09-27 体检（P0）：宿主机只有 1.87G 内存且**没有 swap**，容器原先
    # 没有任何上限，而容器里常驻 5 个 chrome-headless —— 一次内存尖峰会被内核
    # OOM 杀掉（杀掉的多半是 chromium 或 python 主进程，表现为"机器人突然失联"）。
    # 1.3G 是"够用 + 给宿主机与 caddy 留余量"的值（实测占用 358M）。
    mem_limit: 1300m
    # /dev/shm：Docker 默认只给 64MB，而容器里常驻 5 个 chromium（且启动参数里
    # **没有** --disable-dev-shm-usage）—— 64MB 是 chromium 崩溃的经典原因，
    # 表现就是"机器人突然不回话"。512MB 够用，且计入上面的内存上限。
    shm_size: 512m
    # 日志轮转：原先 json-file 无上限，长期吃盘（容器重建才会清）。
    # 注意 bot.log 是**挂载到宿主机**的独立文件，不受这里影响。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CONTAINER_MODE: "1"
      # 本地走宿主机 Clash；云端香港/新加坡直连设空字符串（.env 里 DZMM_PROXY=）
      DZMM_PROXY: "${DZMM_PROXY:-}"
      # 空 = 用 playwright 自带 chromium（镜像内已 install chromium）
      PLAYWRIGHT_CHANNEL: ""
      TZ: "Asia/Shanghai"
      # 凭据注入（从 .env 读，不写死进镜像）
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # 飞书告警 webhook（主通道，无 session 依赖）+ 可选签名密钥
      FEISHU_WEBHOOK: "${FEISHU_WEBHOOK:-}"
      FEISHU_SECRET: "${FEISHU_SECRET:-}"
      # 主站域名（多线路切换：节点故障/撞验证码时改 .env 的 DZMM_HOST，见 dzmm-addr 页面）
      DZMM_HOST: "${DZMM_HOST:-www.dzmm.ai}"
      # 验证码远程桌面：容器内 chromium 用 headed 模式显示到宿主机 Xvfb :99
      DISPLAY: ":99"
      # noVNC 远程桌面连接信息（撞验证码时人工处理用，从 .env 读）
      VNC_URL: "${VNC_URL:-http://47.237.152.187:6080/vnc.html}"
      VNC_PASS: "${VNC_PASS:-dzmm2026}"
      CAPTCHA_WAIT_MIN: "${CAPTCHA_WAIT_MIN:-30}"

      # ---- P3/P4/P5：以下键原先**没有透传**，所以配了也不生效 ----
      # 出站队列（P3）。off = 退回直发
      DZMM_OUTBOX: "${DZMM_OUTBOX:-on}"
      # P12-I 按群并行：on = 每群一个主循环实例（一个群的长任务不再堵住另一个群）。
      # 决定的是**进程结构**（起几个实例），所以只能重启生效，默认 off = 老行为。
      DZMM_PARALLEL_GROUPS: "${DZMM_PARALLEL_GROUPS:-off}"
      # 官方 Bot 群文本通道（P4）。off = 只接线不上线
      DZMM_BOT_ROUTING: "${DZMM_BOT_ROUTING:-off}"
      DZMM_BOT_TOKEN: "${DZMM_BOT_TOKEN:-}"
      # Bot id：同时用于 is_self（免得小小糯把自己的 Bot 发言当成群友）
      DZMM_BOT_ID: "${DZMM_BOT_ID:-}"
      DZMM_BOT_CID: "${DZMM_BOT_CID:-}"
      DZMM_BOT_NAME: "${DZMM_BOT_NAME:-小小糯}"
      DZMM_BOT_SHORT: "${DZMM_BOT_SHORT:-小小糯}"
      # ---- P12-H：第二个 Bot（玫瑰房的「薇丝-bot」）----
      # ⚠️ 这个 compose 是**逐键透传**（没有 env_file），所以新 Bot 的 token
      #    必须在这里显式列一行，否则 .env 里配了也进不了容器 ——
      #    表现是"页面/配置里都有这个 Bot，运行期却说 token 没解析到"。
      # 群绑定与名字在 config.json 的 bots[] 里（那里才是唯一真源）；
      # 身份识别优先用 bots[].uid，没写就用这里的名称去成员表里认。
      DZMM_BOT_TOKEN_ROSE: "${DZMM_BOT_TOKEN_ROSE:-}"
      DZMM_BOT_SECRET_ROSE: "${DZMM_BOT_SECRET_ROSE:-}"
      # ---- P12-T：第三个 Bot（「上班如上坟，下班如还魂」群的「若瑾」）----
      # 同上：逐键透传，名字与群绑定在 config.json 的 bots[] 里。
      DZMM_BOT_TOKEN_RUOJIN: "${DZMM_BOT_TOKEN_RUOJIN:-}"
      DZMM_BOT_SECRET_RUOJIN: "${DZMM_BOT_SECRET_RUOJIN:-}"
      # 认证群那个 Bot 的 Webhook Secret（P12-J；原来只有 ROSE 那个透传了）
      DZMM_BOT_SECRET: "${DZMM_BOT_SECRET:-}"
      # ---- P12-J：官方 Bot Webhook 接收端（收消息走平台直推，不再只靠 Socket.IO）----
      # 0/不设 = 关闭（默认关，行为与之前一致）。开了之后容器监听这个端口，
      # 由宿主机 Caddy 终止 TLS 后反代进来（见 ports 里的 127.0.0.1 绑定）。
      DZMM_WEBHOOK_PORT: "${DZMM_WEBHOOK_PORT:-0}"
      # 唯一登录者会话锁（P5.1）。off = 不互斥
      DZMM_SESSION_LOCK: "${DZMM_SESSION_LOCK:-on}"
      # 出站限流（P5.2）。off = 不限流
      DZMM_THROTTLE: "${DZMM_THROTTLE:-on}"
      DZMM_RATE_PER_MIN: "${DZMM_RATE_PER_MIN:-90}"
      # 运维后台（P9）。off = 整体不启动
      DZMM_ADMIN: "${DZMM_ADMIN:-on}"
      DZMM_ADMIN_PORT: "${DZMM_ADMIN_PORT:-8090}"
      # 容器内**必须**绑 0.0.0.0：docker-proxy 是从容器 IP 转发进来的，
      # 绑回环会让下面发布出来的端口连不上（第一次部署就是这么失败的）。
      DZMM_ADMIN_HOST: "${DZMM_ADMIN_HOST:-0.0.0.0}"
      # 声明"这条端口发布到了回环之外"。dashboard 见到 on 却没有令牌会**拒绝启动**
      # （fail closed）—— 免得"忘了设令牌"变成一次静默裸奔。
      DZMM_ADMIN_PUBLIC: "${DZMM_ADMIN_PUBLIC:-on}"
      # 登录账号密码（发布到公网时必填）。密码 <8 位会被拒绝启动。
      # 刻意用 `${...:-}` 而不是 `${...:?}`：`:?` 会让**整个 compose** 起不来
      # （连 bot 容器一起），blast radius 太大。缺失时只让 dashboard 自己拒绝启动。
      DZMM_ADMIN_USER: "${DZMM_ADMIN_USER:-admin}"
      DZMM_ADMIN_PASSWORD: "${DZMM_ADMIN_PASSWORD:-}"
    ports:
      # 面板对外可达 —— 所以**必须**同时具备：
      #   1) .env 里的 DZMM_ADMIN_USER / DZMM_ADMIN_PASSWORD（缺密码 dashboard 拒绝启动）
      #   2) 安全组把 8090 只放行你自己的出口 IP（不要 0.0.0.0/0）
      # 想要"完全不开公网口"的旧行为：把下面这行换成
      #    - "127.0.0.1:8090:8090"
      # （P9 之后授权方式已改成账号密码登录；早期那套 URL 令牌已废弃，
      #   容器内 bind 仍**必须**是 0.0.0.0，见上面 DZMM_ADMIN_HOST 的注释。）
      - "${DZMM_ADMIN_BIND:-0.0.0.0}:8090:8090"
      # P12-J Webhook：**只绑回环**（127.0.0.1），公网入口一律由宿主机 Caddy
      # 终止 TLS 后反代 —— 这样外界扫不到这个端口，只有 Caddy 能连它。
      - "127.0.0.1:${DZMM_WEBHOOK_PORT:-8091}:${DZMM_WEBHOOK_PORT:-8091}"
    volumes:
      # 运行数据持久化
      - ./state.json:/app/state.json
      - ./profiles.json:/app/profiles.json
      - ./profile_scan.json:/app/profile_scan.json
      - ./novels:/app/novels
      # prompt 外置（P8 第 3 步）：挂上才能"改 prompt 不重新 build"。
      # 目录为空/没挂上 -> 自动退回代码里的默认值（见 runtime/prompts.py），不会变空。
      - ./prompts:/app/prompts
      # 按群/Bot 配置（P11）：**服务器侧状态**，运维界面会写它。
      # 挂的是**目录**（不是单文件）：单文件 bind mount 上 os.replace 会 EBUSY，
      # 原子替换写不成；目录内 rename 就没这个问题。
      # 目录不存在时 Docker 只建一个空目录（无害，会退回代码默认值）——
      # 而单文件挂载的源不存在时 Docker 会建**目录**顶在文件路径上，那才叫麻烦。
      # 里面：config.json + config_backups/ + config_audit.log
      - ./config:/app/config
      # 出站队列 sqlite（P3）：原先没挂，容器重建即丢（只影响审计留痕）
      - ./data:/app/data
      # 日志持久化（容器重建不清空，历史可追溯）
      - ./bot.log:/app/bot.log
      - ./check_health.log:/app/check_health.log
      - ./renew_token.log:/app/renew_token.log
      # 巡检的去重/去抖状态。原先没挂 -> 每次重建容器就丢，会重复发一遍告警
      - ./check_health_state.json:/app/check_health_state.json
      # 续期失败计数与 emergency 冷却时间戳（原先也没挂，重建即丢）
      - ./renew_fail_state.json:/app/renew_fail_state.json
      - ./renew_emergency_state.json:/app/renew_emergency_state.json
      # ---- P12-AI（2026-09-27）：浏览器 profile 挂出来，别再"每次重建都冷登录" ----
      # 症状（屋主报"经常 token 续期失效"）：这些 Playwright 持久化 profile 原先**没挂载**，
      # 容器一重建（每次 deploy 都会重建）里面就是空的 ⇒ `headless_relogin.py` 没有缓存
      # 登录态可用，只能重新走一遍**账号密码登录** —— 而那正是最容易被风控/验证码拦下的路径。
      # 挂上之后重建仍是热登录态，验证码概率大幅下降。
      #   pw_profile / pw_profile_greet：bot 的常驻群页与问候页（重建后不必重新加载）
      #   pw_login：登录态缓存（就是上面那条"冷登录"的关键）
      #   pw_captcha：人工过验证码专用（独立 profile，避免与自动登录互相干扰）
      # entrypoint 启动前会清掉里面残留的 `Singleton*` 锁，否则新容器的 chromium 会拒绝启动。
      - ./pw_profile:/app/pw_profile
      - ./pw_profile_greet:/app/pw_profile_greet
      - ./pw_login:/app/pw_login
      - ./pw_captcha:/app/pw_captcha
      # 验证码远程桌面：挂载 X socket，容器内 chromium headed 显示到宿主机虚拟屏
      - /tmp/.X11-unix:/tmp/.X11-unix
      # 凭据（本地从已迁移的 token JSON + login 挂载；云端改用 secrets）
      - ./.dzmm_token.json:/app/.dzmm_token.json
      - ./.dzmm_login.json:/app/.dzmm_login.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
